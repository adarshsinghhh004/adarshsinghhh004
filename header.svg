<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020617"/>
    <stop offset="55%" stop-color="#0b1f3a"/>
    <stop offset="100%" stop-color="#123b73"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" x2="1">
    <stop offset="0%" stop-color="#60a5fa"/>
    <stop offset="50%" stop-color="#bfdbfe"/>
    <stop offset="100%" stop-color="#60a5fa"/>
  </linearGradient>
  <linearGradient id="wave" x1="0" x2="1">
    <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.18"/>
    <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.32"/>
    <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.18"/>
  </linearGradient>
  <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1200" height="300" rx="18" fill="url(#bg)"/>

<!-- subtle ambient lights -->
<circle cx="130" cy="70" r="90" fill="#2563eb" opacity="0.05">
  <animate attributeName="opacity" values="0.03;0.08;0.03" dur="6s" repeatCount="indefinite"/>
</circle>
<circle cx="1070" cy="80" r="110" fill="#60a5fa" opacity="0.04">
  <animate attributeName="opacity" values="0.02;0.07;0.02" dur="7s" repeatCount="indefinite"/>
</circle>

<!-- restrained moving wave -->
<path d="M0 230 C170 180 320 185 500 225 S850 275 1200 205 L1200 300 L0 300 Z" fill="url(#wave)">
  <animate attributeName="d" dur="9s" repeatCount="indefinite" values="M0 230 C170 180 320 185 500 225 S850 275 1200 205 L1200 300 L0 300 Z;M0 215 C170 255 330 245 510 205 S870 170 1200 225 L1200 300 L0 300 Z;M0 230 C170 180 320 185 500 225 S850 275 1200 205 L1200 300 L0 300 Z"/>
</path>

<!-- fine wave line -->
<path d="M0 226 C170 176 320 181 500 221 S850 271 1200 201" fill="none" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.5">
  <animate attributeName="d" dur="9s" repeatCount="indefinite" values="M0 226 C170 176 320 181 500 221 S850 271 1200 201;M0 211 C170 251 330 241 510 201 S870 166 1200 221;M0 226 C170 176 320 181 500 221 S850 271 1200 201"/>
</path>

<!-- subtle moving accent -->
<circle cx="120" cy="225" r="3" fill="#93c5fd" filter="url(#softGlow)">
  <animate attributeName="cx" values="120;1080;120" dur="11s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="225;205;225" dur="11s" repeatCount="indefinite"/>
</circle>

<!-- professional title -->
<text x="600" y="120" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" letter-spacing="5" filter="url(#textGlow)">ADARSH SINGH</text>
<text x="600" y="160" text-anchor="middle" fill="#bfdbfe" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" letter-spacing="3">CSE STUDENT  •  JAVA &amp; DSA  •  EXPLORING DEVOPS</text>

<!-- animated divider -->
<line x1="430" y1="188" x2="770" y2="188" stroke="url(#accent)" stroke-width="2" stroke-linecap="round">
  <animate attributeName="x1" values="430;500;430" dur="4s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="770;700;770" dur="4s" repeatCount="indefinite"/>
</line>

<!-- minimal corner accents -->
<path d="M42 42 H120" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
<path d="M1080 258 H1158" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
