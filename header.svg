<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020617"/>
    <stop offset="55%" stop-color="#0b1f3a"/>
    <stop offset="100%" stop-color="#123b73"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" x2="1">
    <stop offset="0%" stop-color="#60a5fa"/>
    <stop offset="50%" stop-color="#dbeafe"/>
    <stop offset="100%" stop-color="#60a5fa"/>
  </linearGradient>
  <linearGradient id="wave" x1="0" x2="1">
    <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.12"/>
    <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.12"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1200" height="300" rx="18" fill="url(#bg)"/>

<!-- slow ambient glow -->
<ellipse cx="180" cy="70" rx="150" ry="85" fill="#2563eb" opacity="0.035">
  <animate attributeName="opacity" values="0.02;0.07;0.02" dur="8s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="1030" cy="75" rx="170" ry="95" fill="#60a5fa" opacity="0.03">
  <animate attributeName="opacity" values="0.015;0.06;0.015" dur="9s" repeatCount="indefinite"/>
</ellipse>

<!-- smooth professional wave -->
<path fill="url(#wave)" d="M0 232 C180 175 330 185 505 225 C700 270 875 275 1200 205 L1200 300 L0 300 Z">
  <animate attributeName="d" dur="12s" repeatCount="indefinite" values="M0 232 C180 175 330 185 505 225 C700 270 875 275 1200 205 L1200 300 L0 300 Z;M0 215 C180 255 335 245 510 205 C700 165 890 170 1200 225 L1200 300 L0 300 Z;M0 232 C180 175 330 185 505 225 C700 270 875 275 1200 205 L1200 300 L0 300 Z"/>
</path>

<!-- clean wave edge -->
<path fill="none" stroke="#60a5fa" stroke-opacity="0.42" stroke-width="1.5" d="M0 228 C180 171 330 181 505 221 C700 266 875 271 1200 201">
  <animate attributeName="d" dur="12s" repeatCount="indefinite" values="M0 228 C180 171 330 181 505 221 C700 266 875 271 1200 201;M0 211 C180 251 335 241 510 201 C700 161 890 166 1200 221;M0 228 C180 171 330 181 505 221 C700 266 875 271 1200 201"/>
</path>

<!-- subtle travelling light -->
<circle cy="222" r="2.5" fill="#bfdbfe" filter="url(#glow)">
  <animate attributeName="cx" values="80;1120;80" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="222;202;222" dur="10s" repeatCount="indefinite"/>
</circle>

<!-- highlighted typography -->
<text x="600" y="120" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" letter-spacing="6" filter="url(#glow)">ADARSH SINGH</text>
<text x="600" y="160" text-anchor="middle" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" letter-spacing="3">CSE STUDENT  •  JAVA &amp; DSA  •  EXPLORING DEVOPS</text>

<!-- restrained animated divider -->
<line x1="420" y1="188" x2="780" y2="188" stroke="url(#accent)" stroke-width="2" stroke-linecap="round">
  <animate attributeName="x1" values="420;470;420" dur="5s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="780;730;780" dur="5s" repeatCount="indefinite"/>
</line>

<!-- minimal frame accents -->
<path d="M42 42 H115" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
<path d="M1085 258 H1158" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
</svg>