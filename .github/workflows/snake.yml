name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Generate Animated Headers
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import math

          W, H = 1000, 250
          frames_top = []
          frames_bottom = []
          title_font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 52)

          for i in range(18):
              t = i / 18 * 2 * math.pi

              # ---------- TOP HEADER: name only ----------
              top = Image.new('RGB', (W, H), (3, 12, 30))
              d = ImageDraw.Draw(top)
              for y in range(H):
                  ratio = y / H
                  d.line((0, y, W, y), fill=(4, int(17 + 18 * ratio), int(48 + 42 * ratio)))

              pts = []
              for x in range(0, W + 1, 8):
                  y = 198 + 12 * math.sin(x / 125 + t) + 4 * math.sin(x / 260 - t)
                  pts.append((x, y))
              d.polygon(pts + [(W, H), (0, H)], fill=(7, 27, 58))
              d.line(pts, fill=(96, 165, 250), width=2)

              title = 'ADARSH SINGH'
              box = d.textbbox((0, 0), title, font=title_font)
              tw = box[2] - box[0]
              d.text(((W - tw) / 2, 86), title, font=title_font, fill=(248, 250, 252))

              # restrained moving light
              lx = int(150 + (W - 300) * ((math.sin(t) + 1) / 2))
              d.ellipse((lx - 3, 55, lx + 3, 61), fill=(147, 197, 253))
              frames_top.append(top)

              # ---------- BOTTOM HEADER: no name/text ----------
              bottom = Image.new('RGB', (W, H), (3, 12, 30))
              b = ImageDraw.Draw(bottom)
              for y in range(H):
                  ratio = y / H
                  b.line((0, y, W, y), fill=(4, int(17 + 18 * ratio), int(48 + 42 * ratio)))

              pts2 = []
              for x in range(0, W + 1, 8):
                  y = 105 + 15 * math.sin(x / 145 + t) + 5 * math.sin(x / 290 - t)
                  pts2.append((x, y))
              b.polygon(pts2 + [(W, 250), (0, 250)], fill=(7, 27, 58))
              b.line(pts2, fill=(96, 165, 250), width=2)

              # soft travelling accent, with no text
              lx2 = int(100 + (W - 200) * ((math.sin(t) + 1) / 2))
              b.line((lx2, 65, lx2 + 110, 65), fill=(96, 165, 250), width=2)
              frames_bottom.append(bottom)

          frames_top[0].save('dist/header.gif', save_all=True, append_images=frames_top[1:], duration=120, loop=0, optimize=True)
          frames_bottom[0].save('dist/footer.gif', save_all=True, append_images=frames_bottom[1:], duration=120, loop=0, optimize=True)
          PY

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
